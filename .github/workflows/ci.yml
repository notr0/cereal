name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Cereal only ships for Windows, so check it there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Scripts are skipped so the Electron binary isn't downloaded; type-checks, tests and the bundle don't need it.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
